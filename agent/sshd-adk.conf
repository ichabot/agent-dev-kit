# agent-dev-kit sshd hardening (docs/hermes-remote.md). Managed file: cloud-init writes
# it at first boot, agent/setup.sh keeps it in sync. First match wins in sshd, so this
# drop-in (10-) beats the distribution and cloud-init defaults (50-).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Root-owned key files: the agent cannot add keys of its own and keep access.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
AllowTcpForwarding no
# A forwarded agent socket would be usable by the AI running as hermes.
AllowAgentForwarding no
# Unix-socket forwarding is not covered by AllowTcpForwarding/PermitOpen.
AllowStreamLocalForwarding no
PermitTunnel no
X11Forwarding no
AllowUsers adk-admin hermes

# Hermes Desktop needs local forwarding to the loopback backend only. Defense in depth:
# a shell as hermes has open outbound anyway; the metadata service is blocked by nftables
# (adk-egress.service), not by this rule.
Match User hermes
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:*

# End the Match block, so lines that follow this file (Debian's main sshd_config sets
# X11Forwarding yes after the Include) can never land in it. Repeated here as well: for
# keywords set in a Match block, the first matching block wins over global values.
Match all
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
