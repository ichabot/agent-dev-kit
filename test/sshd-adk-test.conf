# agent-dev-kit sshd hardening of the TEST VM (docs/test-vm.md). Managed file: cloud-init
# writes it at first boot, test/setup.sh keeps it in sync. First match wins in sshd, so this
# drop-in (10-) beats the distribution and cloud-init defaults (50-).
# The global part is the same as agent/sshd-adk.conf (a test keeps both in sync).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Root-owned key files: the agent cannot add keys of its own and keep access.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
AllowTcpForwarding no
# A forwarded agent socket would be usable by the AI running as hermes.
AllowAgentForwarding no
# Unix-socket forwarding is not covered by AllowTcpForwarding/PermitOpen.
AllowStreamLocalForwarding no
PermitTunnel no
X11Forwarding no
AllowUsers adk-admin deploy

# CI deploy key (agent VPS): only the deploy gate, which parses "deploy <project> <ref>".
# The key line itself carries restrict,command="..." (agent/add-key.sh --forced-command);
# this block is the second layer for any key that ever lands in the deploy user's file.
Match User deploy
    ForceCommand /opt/adk/test/deploy-gate.sh
    PermitTTY no
    AllowTcpForwarding no
    PermitUserRC no
    PermitListen none
    PermitOpen none

# End the Match block, so lines that follow this file (Debian's main sshd_config sets
# X11Forwarding yes after the Include) can never land in it. Repeated here as well: for
# keywords set in a Match block, the first matching block wins over global values.
Match all
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
