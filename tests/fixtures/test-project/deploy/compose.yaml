# Fixture app for the TEST deploy (agent-dev-kit tests and lab run): static nginx.
# Published on 127.0.0.1 only (port from deploy/adk.json); Caddy on the TEST VM proxies to it.
services:
  web:
    image: docker.io/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    environment:
      GREETING: ${GREETING:-unset}
    volumes:
      - ./site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
